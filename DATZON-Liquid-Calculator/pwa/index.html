<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <meta name="description" content="DATZON Liquid Calculator. Kalkulator premium dengan tampilan liquid glass dan dukungan offline.">
  <title>DATZON Liquid Calculator</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root{color-scheme:dark;--ink:#080b14;--mint:#a5f5d4;--muted:#98a5b9;--line:rgba(255,255,255,.13)}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{min-height:100%;margin:0;background:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f5f8fd}
    body{min-height:100svh;overflow-x:hidden;background:radial-gradient(ellipse at 83% 4%,rgba(44,191,157,.16),transparent 31rem),radial-gradient(ellipse at 5% 52%,rgba(92,116,232,.13),transparent 27rem),linear-gradient(140deg,#0b1120,#080b14 52%,#111a24);}
    .shell{width:min(100%,470px);margin:auto;min-height:100svh;padding:calc(env(safe-area-inset-top) + 20px) 18px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;justify-content:center}
    .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:23px}
    .brand{display:flex;gap:11px;align-items:center}.mark{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;color:#092019;font-size:27px;font-weight:900;background:linear-gradient(140deg,#b8ffe0,#51bfa1);box-shadow:0 9px 28px rgba(61,217,174,.2)}
    .brand strong{display:block;font-size:15px;letter-spacing:2.8px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.55px;margin-top:3px}
    .badge{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.065);padding:8px 12px;border-radius:99px;color:var(--mint);font-weight:800;font-size:10px;letter-spacing:1.5px;display:flex;align-items:center;gap:7px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.dot{width:6px;height:6px;background:var(--mint);border-radius:50%;box-shadow:0 0 12px #9df6d0}
    .display{border:1px solid transparent;border-radius:30px;padding:22px 22px 20px;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.035) 65%,rgba(150,248,211,.035)) padding-box,linear-gradient(140deg,rgba(255,255,255,.23),rgba(255,255,255,.04),rgba(157,246,208,.17)) border-box;box-shadow:0 20px 45px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.06);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
    .meta{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:9px;letter-spacing:1.7px;font-weight:650}.local{color:rgba(165,245,212,.92);letter-spacing:1px}
    .formula{min-height:23px;margin-top:27px;font-size:13px;letter-spacing:.55px;text-align:right;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .value{font-size:clamp(36px,11vw,48px);line-height:1.12;letter-spacing:-1.7px;font-weight:300;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:7px;font-variant-numeric:tabular-nums;transition:opacity .12s}.value.error{font-size:29px;color:#ff9fae;letter-spacing:-.5px}
    .precision{display:flex;align-items:center;gap:7px;margin-top:20px;color:rgba(165,245,212,.83);font-size:9px;letter-spacing:1.7px}.precision:before{content:"";width:22px;height:2px;border-radius:99px;background:var(--mint)}
    .keys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:19px}
    .key{height:clamp(57px,15vw,65px);border:1px solid rgba(255,255,255,.095);border-radius:22px;color:#f7faff;background:linear-gradient(145deg,rgba(255,255,255,.105),rgba(255,255,255,.045));font:500 22px/1 inherit;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.035);transition:transform .09s ease,filter .13s ease,background .15s ease;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);touch-action:manipulation;user-select:none}
    .key:active{transform:scale(.955);filter:brightness(1.25)}.key.utility{background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.075));color:#e5f1f0;font-size:16px;font-weight:650}.key.operator,.key.equals{border-color:rgba(255,255,255,.44);background:linear-gradient(145deg,#b5ffe0,#6ddbb7);color:#09251b;font-weight:700}.key.equals{background:linear-gradient(145deg,#c0ffe5,#66ddb6);box-shadow:0 8px 23px rgba(91,220,178,.13)}
    .footer{display:flex;align-items:center;justify-content:center;gap:8px;color:rgba(255,255,255,.4);font-size:8px;letter-spacing:1.4px;margin-top:18px;white-space:nowrap}.footer i{width:3px;height:3px;border-radius:50%;background:rgba(165,245,212,.65)}
    .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 25px);transform:translate(-50%,12px);opacity:0;pointer-events:none;white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:rgba(18,27,41,.9);padding:11px 15px;color:#f4f8ff;font-size:12px;backdrop-filter:blur(18px);transition:opacity .2s,transform .2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(min-height:790px){.shell{padding-top:28px;padding-bottom:24px}.top{margin-bottom:27px}.display{padding:25px 24px 22px}.keys{gap:11px;margin-top:22px}.key{height:67px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <main class="shell" aria-label="DATZON Liquid Calculator">
    <header class="top">
      <div class="brand"><div class="mark" aria-hidden="true">◈</div><div><strong>DATZON</strong><small>LIQUID CALCULATOR</small></div></div>
      <div class="badge"><span class="dot"></span>PRO</div>
    </header>
    <section class="display" aria-live="polite">
      <div class="meta"><span>LIVE WORKSPACE</span><span class="local">● &nbsp;LOCAL ENGINE</span></div>
      <div class="formula" id="formula">YOUR NEXT MOVE STARTS HERE</div>
      <div class="value" id="value">0</div>
      <div class="precision" id="precision">PRECISION MODE</div>
    </section>
    <section class="keys" aria-label="Tombol kalkulator">
      <button class="key utility" data-key="AC">AC</button><button class="key utility" data-key="DEL" aria-label="Hapus karakter terakhir">⌫</button><button class="key utility" data-key="%">%</button><button class="key operator" data-key="/">÷</button>
      <button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key operator" data-key="*">×</button>
      <button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key operator" data-key="-">−</button>
      <button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key operator" data-key="+">+</button>
      <button class="key utility" data-key="SIGN">±</button><button class="key" data-key="0">0</button><button class="key" data-key=".">.</button><button class="key equals" data-key="=">=</button>
    </section>
    <footer class="footer"><span>DESIGNED IN LIQUID GLASS</span><i></i><span>DATZON STUDIO · 01</span></footer>
  </main>
  <div class="toast" id="toast" role="status"></div>
  <script>
  (()=>{
    const formulaEl=document.querySelector('#formula'),valueEl=document.querySelector('#value'),precisionEl=document.querySelector('#precision'),toastEl=document.querySelector('#toast');
    let expression='0',result='0',formula='',evaluated=false,error=false,toastTimer;
    const operators=['+','-','*','/'];
    const format=n=>{if(Math.abs(n)<1e-9)n=0;return new Intl.NumberFormat('en-US',{maximumFractionDigits:8,useGrouping:true}).format(n)};
    const token=()=>expression.match(/[0-9]*\.?[0-9]+$/)?.[0]??'0';
    const pretty=s=>s.replaceAll('*',' × ').replaceAll('/',' ÷ ').replaceAll('-','−').replaceAll('+',' + ');
    function parse(source){let i=0;const skip=()=>{while(i<source.length && /\s/.test(source[i]))i++};
      function expr(){let v=term();while(true){skip();if(source[i]==='+'){i++;v+=term()}else if(source[i]==='-'){i++;v-=term()}else return v}}
      function term(){let v=factor();while(true){skip();if(source[i]==='*'){i++;v*=factor()}else if(source[i]==='/'){i++;const d=factor();if(Math.abs(d)<1e-12)throw Error('Tidak bisa membagi dengan nol');v/=d}else return v}}
      function factor(){skip();if(source[i]==='+'){i++;return factor()}if(source[i]==='-'){i++;return -factor()}if(source[i]==='('){i++;const v=expr();skip();if(source[i]!==')')throw Error('Ekspresi belum lengkap');i++;return v}const start=i;let digit=false;while(/[0-9]/.test(source[i]||'')){i++;digit=true}if(source[i]==='.'){i++;while(/[0-9]/.test(source[i]||'')){i++;digit=true}}if(!digit)throw Error('Angka belum lengkap');return Number(source.slice(start,i))}
      const answer=expr();skip();if(i!==source.length||!Number.isFinite(answer))throw Error('Ekspresi tidak valid');return answer}
    function clear(){expression='0';result='0';formula='';evaluated=false;error=false;render()}
    function calc(){try{formula=expression;result=format(parse(expression));evaluated=true;error=false}catch(e){formula=expression;result=e.message||'Ekspresi tidak valid';evaluated=true;error=true}render()}
    function press(k){const wasError=error;error=false;
      if(k==='AC'){clear();return}
      if(k==='DEL'){if(evaluated){clear();return}expression=expression.length<=1||(expression.length===2&&expression[0]==='-')?'0':expression.slice(0,-1)}
      else if(operators.includes(k)){
        if(evaluated){expression=wasError?'0':result.replaceAll(',','');evaluated=false;formula=''}
        if(expression==='0'&&k==='-')expression='-';else if(operators.includes(expression.at(-1)))expression=expression.slice(0,-1)+k;else expression+=k;
      }
      else if(k==='='){if(!evaluated){calc();return}}
      else if(k==='%'){
        if(evaluated){expression=wasError?'0':result.replaceAll(',','');evaluated=false;formula=''}
        const m=expression.match(/[0-9]+(?:\.[0-9]*)?$/);if(m)expression=expression.slice(0,m.index)+String(Number(m[0])/100);
      }
      else if(k==='SIGN'){
        if(evaluated){expression=wasError?'0':String(-(Number(result.replaceAll(',',''))||0));evaluated=false;formula=''}
        else {const m=expression.match(/[0-9]+(?:\.[0-9]*)?$/);if(m){const start=m.index,prev=expression[start-1];if(start===0)expression=expression.startsWith('-')?expression.slice(1):'-'+expression;else if(prev==='+'||prev==='-')expression=expression.slice(0,start-1)+(prev==='+'?'-':'+')+m[0];else if(prev==='*'||prev==='/')expression=expression.slice(0,start)+'(-'+m[0]+')'}}
      }
      else if(k==='.'){
        if(evaluated){expression='0.';evaluated=false;formula=''}else if(!token().includes('.'))expression=operators.includes(expression.at(-1))?expression+'0.':expression==='0'?'0.':expression+'.';
      }
      else {if(evaluated){expression=k;evaluated=false;formula=''}else expression=expression==='0'?k:expression+k}
      render()
    }
    function render(){formulaEl.textContent=evaluated&&formula?pretty(formula):expression==='0'?'YOUR NEXT MOVE STARTS HERE':pretty(expression);let display=evaluated?result:operators.includes(expression.at(-1))?'0':token();valueEl.textContent=display;valueEl.classList.toggle('error',error);if(error)valueEl.textContent=result;precisionEl.textContent=evaluated&&!error?'RESULT LOCKED IN':'PRECISION MODE';}
    function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1600)}
    document.querySelectorAll('[data-key]').forEach(b=>b.addEventListener('click',()=>press(b.dataset.key)));
    document.addEventListener('keydown',e=>{if(/^[0-9.]$/.test(e.key))press(e.key);else if(['+','-','*','/'].includes(e.key))press(e.key);else if(e.key==='Enter'||e.key==='='){e.preventDefault();press('=')}else if(e.key==='Backspace')press('DEL');else if(e.key==='Escape')press('AC');else if(e.key==='%')press('%')});
    if('serviceWorker' in navigator && location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>toast('Mode offline tidak tersedia'));
    render();
  })();
  </script>
</body>
</html>
